// Defaults for game data without a `default.cfg` (the 2021 re-release).
// Embedded at `/quake/id1/`: a pak that ships its own one wins.

unbindall

// Move: WASD, mouselook
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+jump"
bind c "+movedown"
bind SHIFT "+speed"
bind ALT "+strafe"
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind LEFTARROW "+left"
bind RIGHTARROW "+right"
+mlook

// Fight
bind MOUSE1 "+attack"
bind CTRL "+attack"
bind MOUSE2 "+jump"
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"

// Game
bind TAB "+showscores"
bind t "messagemode"
bind PAUSE "pause"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind F1 "help"
bind F2 "menu_save"
bind F3 "menu_load"
bind F4 "menu_options"
bind F5 "menu_multiplayer"
bind F6 "echo Quicksaving...; wait; save quick"
bind F9 "echo Quick Loading...; wait; load quick"
bind F10 "quit"
bind F12 "screenshot"
